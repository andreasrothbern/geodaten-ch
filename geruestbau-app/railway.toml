# Railway Configuration for Geruestbau-App (PWA)

[build]
builder = "DOCKERFILE"
dockerfilePath = "/geruestbau-app/Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Static files served by nginx
# No volume needed - stateless frontend
