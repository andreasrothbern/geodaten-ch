<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8" stroke="#999" stroke-width="0.5"/>
    </pattern>

    <pattern id="cut-hatch" patternUnits="userSpaceOnUse" width="4" height="4">
      <path d="M0,0 l4,4 M0,4 l4,-4" stroke="#666" stroke-width="0.8"/>
    </pattern>

    <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
      <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
    </pattern>

    <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB9A5"/>
      <stop offset="100%" style="stop-color:#4A8A77"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="700" height="480" fill="#FFFFFF"/>

  <!-- Titel -->
  <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">GRUNDRISS - Bundeshaus Bern</text>
  <text x="350" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">EGID: 2242547 | LV95: E 600423, N 199521</text>

  <!-- Geruest-Huelle (1m Abstand) -->
  <rect x="190" y="80" width="320" height="290" fill="none" stroke="#0066CC" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="195" y="75" font-family="Arial, sans-serif" font-size="8" fill="#0066CC">GERUEST-HUELLE (1m Abstand)</text>

  <!-- Hauptgebaeude -->
  <rect x="200" y="90" width="300" height="270" fill="url(#hatch)" stroke="#000" stroke-width="2"/>

  <!-- Arkaden (niedrigerer Bereich) -->
  <rect x="210" y="100" width="280" height="30" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
  <text x="350" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">ARKADEN (6.0m)</text>

  <!-- Kuppel (zentraler Bereich) -->
  <circle cx="350" cy="235" r="40" fill="url(#copper)" stroke="#000" stroke-width="2"/>
  <text x="350" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">KUPPEL</text>
  <text x="350" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(64.0m)</text>

  <!-- Fassadenlaengen -->
  <!-- Nord -->
  <line x1="200" y1="85" x2="275" y2="85" stroke="#CC0000" stroke-width="1"/>
  <text x="237" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#CC0000">15.4m</text>

  <line x1="425" y1="85" x2="500" y2="85" stroke="#CC0000" stroke-width="1"/>
  <text x="462" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#CC0000">14.8m</text>

  <!-- Ost -->
  <line x1="505" y1="90" x2="505" y2="135" stroke="#CC0000" stroke-width="1"/>
  <text x="520" y="112" font-family="Arial, sans-serif" font-size="7" fill="#CC0000">14.0m</text>

  <line x1="505" y1="180" x2="505" y2="225" stroke="#CC0000" stroke-width="1"/>
  <text x="520" y="202" font-family="Arial, sans-serif" font-size="7" fill="#CC0000">16.5m</text>

  <line x1="505" y1="270" x2="505" y2="297" stroke="#CC0000" stroke-width="1"/>
  <text x="520" y="283" font-family="Arial, sans-serif" font-size="7" fill="#CC0000">27.0m</text>

  <!-- Sued -->
  <line x1="425" y1="365" x2="500" y2="365" stroke="#CC0000" stroke-width="1"/>
  <text x="462" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#CC0000">6.0m</text>

  <!-- West -->
  <line x1="195" y1="130" x2="195" y2="150" stroke="#CC0000" stroke-width="1"/>
  <text x="175" y="140" font-family="Arial, sans-serif" font-size="7" fill="#CC0000">4.0m</text>

  <line x1="195" y1="200" x2="195" y2="206" stroke="#CC0000" stroke-width="1"/>
  <text x="175" y="203" font-family="Arial, sans-serif" font-size="7" fill="#CC0000">6.0m</text>

  <!-- Geruest-Zugaenge -->
  <circle cx="350" cy="85" r="3" fill="#0066CC"/>
  <text x="350" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#0066CC">Z1</text>

  <circle cx="205" cy="85" r="3" fill="#0066CC"/>
  <text x="205" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#0066CC">Z2</text>

  <circle cx="505" cy="200" r="3" fill="#0066CC"/>
  <text x="520" y="205" font-family="Arial, sans-serif" font-size="7" fill="#0066CC">Z3</text>

  <circle cx="505" cy="95" r="3" fill="#0066CC"/>
  <text x="520" y="100" font-family="Arial, sans-serif" font-size="7" fill="#0066CC">Z4</text>

  <circle cx="350" cy="365" r="3" fill="#0066CC"/>
  <text x="350" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#0066CC">Z5</text>

  <circle cx="195" cy="225" r="3" fill="#0066CC"/>
  <text x="175" y="230" font-family="Arial, sans-serif" font-size="7" fill="#0066CC">Z6</text>

  <!-- Nordpfeil -->
  <g transform="translate(580,120)">
    <path d="M0,20 L0,0 M-5,5 L0,0 L5,5" stroke="#000" stroke-width="2" fill="none"/>
    <text x="10" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold">N</text>
  </g>

  <!-- Massstab -->
  <g transform="translate(550,400)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#000" stroke-width="1"/>
    <line x1="50" y1="-3" x2="50" y2="3" stroke="#000" stroke-width="1"/>
    <text x="25" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">10m</text>
  </g>

  <!-- Legende Hoehenzonen -->
  <g transform="translate(30,300)">
    <rect x="0" y="0" width="120" height="120" fill="none" stroke="#666" stroke-width="1"/>
    <text x="60" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">HOEHENZONEN</text>

    <rect x="10" y="25" width="15" height="10" fill="url(#hatch)"/>
    <text x="30" y="32" font-family="Arial, sans-serif" font-size="8">Hauptgebaeude (30.0m)</text>

    <rect x="10" y="40" width="15" height="10" fill="url(#hatch)"/>
    <text x="30" y="47" font-family="Arial, sans-serif" font-size="8">Arkaden (6.0m)</text>

    <circle cx="17.5" cy="60" r="7.5" fill="url(#copper)"/>
    <text x="30" y="62" font-family="Arial, sans-serif" font-size="8">Kuppel (64.0m)</text>

    <line x1="10" y1="75" x2="25" y2="75" stroke="#0066CC" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="30" y="77" font-family="Arial, sans-serif" font-size="8">Geruest-Huelle</text>

    <circle cx="17.5" cy="90" r="2" fill="#0066CC"/>
    <text x="30" y="92" font-family="Arial, sans-serif" font-size="8">Geruest-Zugang</text>
  </g>

  <!-- Gebaeudedaten -->
  <g transform="translate(30,80)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold">GEBAEUDEDATEN:</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="8">Grundflaeche: 3697 m2</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="8">Umfang: 310.0 m</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="8">Traufhoehe: 53.2 m</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="8">Firsthoehe: 62.6 m</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="8">Dachform: Kuppel (15 deg)</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="8">Baujahr: 1902</text>
  </g>
</svg>