<!-- Verankerungen (gestrichelt, rot) -->
<g stroke="#CC0000" stroke-width="1" stroke-dasharray="3,3" fill="none">
  <line x1="130" y1="70" x2="150" y2="70"/>
  <line x1="130" y1="98" x2="150" y2="98"/>
  <line x1="130" y1="126" x2="150" y2="126"/>
  <line x1="130" y1="154" x2="150" y2="154"/>
  <line x1="130" y1="182" x2="150" y2="182"/>
