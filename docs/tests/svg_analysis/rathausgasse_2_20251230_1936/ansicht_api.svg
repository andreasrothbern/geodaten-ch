  <line x1="122" y1="154" x2="218" y2="154"/> <!-- 19. Lage -->
  <line x1="122" y1="140" x2="218" y2="140"/> <!-- 20. Lage -->
  <line x1="122" y1="126" x2="218" y2="126"/> <!-- 21. Lage -->
  <line x1="122" y1="112" x2="218" y2="112"/> <!-- 22. Lage -->
  <line x1="122" y1="98" x2="218" y2="98"/>   <!-- 23. Lage -->
  <line x1="122" y1="84" x2="218" y2="84"/>   <!-- 24. Lage -->
  <line x1="122" y1="70" x2="218" y2="70"/>   <!-- 25. Lage -->
  <line x1="122" y1="56" x2="218" y2="56"/>   <!-- 26. Lage -->
  <line x1="122" y1="42" x2="218" y2="42"/>   <!-- 27. Lage -->
  
  <!-- Kirchenschiff-Beläge -->
  <line x1="222" y1="406" x2="378" y2="406"/> <!-- 1. Lage -->
  <line x1="222" y1="392" x2="378" y2="392"/> <!-- 2. Lage -->
  <line x1="222" y1="378" x2="378" y2="378"/> <!-- 3. Lage -->
