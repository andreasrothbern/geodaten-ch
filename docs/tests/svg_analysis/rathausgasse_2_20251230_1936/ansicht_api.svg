  <line x1="122" y1="238" x2="218" y2="238"/> <!-- 13. Lage -->
  <line x1="122" y1="224" x2="218" y2="224"/> <!-- 14. Lage -->
  <line x1="122" y1="210" x2="218" y2="210"/> <!-- 15. Lage -->
  <line x1="122" y1="196" x2="218" y2="196"/> <!-- 16. Lage -->
  <line x1="122" y1="182" x2="218" y2="182"/> <!-- 17. Lage -->
