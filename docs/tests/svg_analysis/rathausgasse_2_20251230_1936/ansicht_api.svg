  <line x1="130" y1="238" x2="150" y2="238"/>
  <line x1="130" y1="266" x2="150" y2="266"/>
  <line x1="130" y1="294" x2="150" y2="294"/>
  <line x1="130" y1="322" x2="150" y2="322"/>
  <line x1="230" y1="280" x2="250" y2="280"/>
  <line x1="230" y1="308" x2="250" y2="308"/>
  <line x1="230" y1="336" x2="250" y2="336"/>
</g>

<!-- Höhenskala links -->
<g font-family="Arial" font-size="10" fill="#333">
  <line x1="90" y1="420" x2="100" y2="420" stroke="#333" stroke-width="1"/>
  <text x="85" y="424" text-anchor="end">+/-0.00</text>
  
  <line x1="90" y1="246" x2="100" y2="246" stroke="#333" stroke-width="1"/>
  <text x="85" y="250" text-anchor="end">+25.0</text>
  
  <line x1="90" y1="40" x2="100" y2="40" stroke="#333" stroke-width="1"/>
  <text x="85" y="44" text-anchor="end">+54.6</text>
</g>

<!-- Lagenbeschriftung rechts -->
<g font-family="Arial" font-size="9" fill="#666">
  <text x="660" y="410">1. Lage</text>
  <text x="660" y="340">6. Lage</text>
  <text x="660" y="270">11. Lage</text>
  <text x="660" y="200">16. Lage</text>
  <text x="660" y="130">21. Lage</text>
  <text x="660" y="60">26. Lage</text>
