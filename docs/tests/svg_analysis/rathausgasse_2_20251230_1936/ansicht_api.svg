<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- LOCKERE Schraffur fuer Aussenflaechen -->
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
    <path d="M0,0 l8,8" stroke="#999" stroke-width="0.5"/>
  </pattern>

  <!-- DICHTE Schraffur fuer Schnittflaechen -->
  <pattern id="cut-hatch" patternUnits="userSpaceOnUse" width="4" height="4">
    <path d="M0,0 l4,4 M0,4 l4,-4" stroke="#666" stroke-width="0.8"/>
  </pattern>

  <!-- Terrain/Boden -->
  <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
    <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
  </pattern>

  <!-- Kupfer-Gradient NUR fuer Kuppeln -->
  <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" style="stop-color:#7CB9A5"/>
    <stop offset="100%" style="stop-color:#4A8A77"/>
  </linearGradient>
</defs>

<!-- Hintergrund -->
<rect width="700" height="480" fill="#FFFFFF"/>

<!-- Terrain-Linie -->
<rect x="100" y="420" width="550" height="60" fill="url(#ground)"/>
<line x1="100" y1="420" x2="650" y2="420" stroke="#333" stroke-width="1"/>

<!-- Gebäude-Strukturen (von hinten nach vorn) -->
<!-- Chor (hinten, rechts) -->
<rect x="400" y="295" width="150" height="125" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
<polygon points="400,295 475,250 550,295" fill="url(#hatch)" stroke="#333" stroke-width="1"/>

<!-- Seitenschiffe (links und rechts der Hauptkirche) -->
<rect x="180" y="336" width="50" height="84" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
<polygon points="180,336 205,315 230,336" fill="url(#hatch)" stroke="#333" stroke-width="1"/>

<rect x="370" y="336" width="50" height="84" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
<polygon points="370,336 395,315 420,336" fill="url(#hatch)" stroke="#333" stroke-width="1"/>

<!-- Kirchenschiff (Hauptgebäude) -->
<rect x="230" y="246" width="140" height="174" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
<polygon points="230,246 300,210 370,246" fill="url(#hatch)" stroke="#333" stroke-width="1"/>

<!-- Westturm (vorne, dominierend) -->
<rect x="130" y="40" width="80" height="380" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
<polygon points="130,40 170,25 210,40" fill="url(#hatch)" stroke="#333" stroke-width="1"/>

<!-- Gerüst vor der Fassade -->
<!-- Vertikale Ständer (alle 2.57m ≈ 18px) -->
<g stroke="#0066CC" stroke-width="2" fill="none">
  <!-- Turm-Gerüst -->
  <line x1="122" y1="40" x2="122" y2="420"/>
  <line x1="140" y1="40" x2="140" y2="420"/>
  <line x1="158" y1="40" x2="158" y2="420"/>
  <line x1="176" y1="40" x2="176" y2="420"/>
  <line x1="194" y1="40" x2="194" y2="420"/>
  <line x1="212" y1="40" x2="212" y2="420"/>
  <line x1="218" y1="40" x2="218" y2="420"/>
  
  <!-- Kirchenschiff-Gerüst -->
  <line x1="222" y1="246" x2="222" y2="420"/>
  <line x1="240" y1="246" x2="240" y2="420"/>
  <line x1="258" y1="246" x2="258" y2="420"/>
  <line x1="276" y1="246" x2="276" y2="420"/>
  <line x1="294" y1="246" x2="294" y2="420"/>
