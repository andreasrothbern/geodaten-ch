<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8" stroke="#999" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Hintergrund -->
  <rect width="700" height="480" fill="#FFFFFF"/>

  <!-- Titel -->
  <text x="350" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">GRUNDRISS - Kirche St. Peter und Paul</text>
  <text x="350" y="42" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Rathausgasse 2, 3011 Bern | EGID: 191821074 | Massstab ca. 1:143</text>

  <!-- Gerüstzone (gestrichelt, 1m Abstand) -->
  <rect x="95" y="85" width="360" height="290" fill="none" stroke="#0066CC" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="100" y="80" font-family="Arial" font-size="8" fill="#0066CC">Gerüstzone (+1m)</text>

  <!-- Westturm (links, quadratisch) -->
  <rect x="110" y="180" width="50" height="50" fill="url(#hatch)" stroke="#333" stroke-width="2"/>
  <text x="135" y="210" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">Turm</text>
  <text x="135" y="220" font-family="Arial" font-size="7" text-anchor="middle" fill="#666">54.6m</text>

  <!-- Kirchenschiff (Hauptschiff, zentral) -->
  <rect x="160" y="140" width="200" height="100" fill="url(#hatch)" stroke="#333" stroke-width="2"/>
  <text x="260" y="195" font-family="Arial" font-size="9" text-anchor="middle" fill="#333">Kirchenschiff</text>
  <text x="260" y="207" font-family="Arial" font-size="8" text-anchor="middle" fill="#666">(25.0m)</text>

  <!-- Seitenschiffe (oben und unten) -->
  <rect x="160" y="100" width="200" height="40" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="125" font-family="Arial" font-size="8" text-anchor="middle" fill="#666">Seitenschiff N (12m)</text>
  
  <rect x="160" y="240" width="200" height="40" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="265" font-family="Arial" font-size="8" text-anchor="middle" fill="#666">Seitenschiff S (12m)</text>

  <!-- Chor (rechts, abschliessend) -->
  <rect x="360" y="120" width="80" height="140" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="195" font-family="Arial" font-size="9" text-anchor="middle" fill="#333">Chor</text>
  <text x="400" y="207" font-family="Arial" font-size="8" text-anchor="middle" fill="#666">(18.0m)</text>

  <!-- Fassadenlängen -->
  <!-- West (Turm) -->
  <line x1="100" y1="180" x2="100" y2="230" stroke="#333" stroke-width="0.5"/>
  <text x="95" y="205" font-family="Arial" font-size="7" text-anchor="end" fill="#333">~8m</text>
  
  <!-- Nord -->
  <line x1="110" y1="90" x2="440" y2="90" stroke="#333" stroke-width="0.5"/>
  <text x="275" y="87" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">~48m (N)</text>
  
  <!-- Ost (Chor) -->
  <line x1="450" y1="120" x2="450" y2="260" stroke="#333" stroke-width="0.5"/>
  <text x="455" y="190" font-family="Arial" font-size="7" fill="#333">~29m</text>

  <!-- Gerüst-Zugänge -->
  <circle cx="200" cy="100" r="5" fill="#CC0000"/>
  <text x="200" y="95" font-family="Arial" font-size="7" text-anchor="middle" fill="#CC0000">Z3</text>
  
  <circle cx="380" cy="120" r="5" fill="#CC0000"/>
  <text x="385" y="115" font-family="Arial" font-size="7" fill="#CC0000">Z1</text>
  
  <circle cx="420" cy="200" r="5" fill="#CC0000"/>
  <text x="425" y="203" font-family="Arial" font-size="7" fill="#CC0000">Z2</text>
  
  <circle cx="110" cy="210" r="5" fill="#CC0000"/>
  <text x="105" y="213" font-family="Arial" font-size="7" text-anchor="end" fill="#CC0000">Z4</text>

  <!-- Nordpfeil -->
  <g transform="translate(600, 120)">
    <polygon points="0,-25 -8,-5 0,-10 8,-5" fill="#333"/>
    <line x1="0" y1="-10" x2="0" y2="15" stroke="#333" stroke-width="2"/>
    <text x="0" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">N</text>
  </g>

  <!-- Massstab -->
  <g transform="translate(500, 420)">
    <rect x="0" y="0" width="70" height="6" fill="#333"/>
    <rect x="70" y="0" width="70" height="6" fill="#FFF" stroke="#333"/>
    <text x="0" y="18" font-family="Arial" font-size="8" fill="#333">0</text>
    <text x="70" y="18" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">10m</text>
    <text x="140" y="18" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">20m</text>
  </g>

  <!-- Legende -->
  <g transform="translate(500, 320)">
    <text x="0" y="0" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Legende</text>
    <rect x="0" y="10" width="15" height="10" fill="url(#hatch)" stroke="#333"/>
    <text x="20" y="19" font-family="Arial" font-size="8" fill="#333">Gebäude</text>
    <circle cx="7" cy="35" r="4" fill="#CC0000"/>
    <text x="20" y="39" font-family="Arial" font-size="8" fill="#333">Zugang</text>
    <rect x="0" y="50" width="15" height="8" fill="none" stroke="#0066CC" stroke-dasharray="3,2"/>
    <text x="20" y="57" font-family="Arial" font-size="8" fill="#333">Gerüstzone</text>
  </g>

  <!-- Gebäudedaten -->
  <text x="50" y="450" font-family="Arial" font-size="9" fill="#666">Grundfläche: 1099 m² | Umfang: 168.1 m | Baujahr: 1864 | Neugotik</text>
  <text x="50" y="465" font-family="Arial" font-size="8" fill="#999">LV95: E 601009, N 199736 | Terrain: 533.5 m ü.M.</text>
</svg>
