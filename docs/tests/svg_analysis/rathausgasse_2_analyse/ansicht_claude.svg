<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8" stroke="#999" stroke-width="0.5"/>
    </pattern>
    <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
      <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Hintergrund -->
  <rect width="700" height="480" fill="#FFFFFF"/>

  <!-- Titel -->
  <text x="350" y="22" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">FASSADENANSICHT WEST - Kirche St. Peter und Paul</text>
  <text x="350" y="38" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Rathausgasse 2, 3011 Bern | Massstab 1:143</text>

  <!-- Terrain -->
  <rect x="60" y="420" width="580" height="40" fill="url(#ground)"/>
  <line x1="60" y1="420" x2="640" y2="420" stroke="#333" stroke-width="2"/>

  <!-- Höhenskala links -->
  <line x1="55" y1="420" x2="55" y2="40" stroke="#333" stroke-width="1"/>
  
  <line x1="50" y1="420" x2="60" y2="420" stroke="#333" stroke-width="1"/>
  <text x="45" y="424" font-family="Arial" font-size="9" text-anchor="end" fill="#333">±0.00</text>
  
  <line x1="50" y1="336" x2="60" y2="336" stroke="#333" stroke-width="1"/>
  <text x="45" y="340" font-family="Arial" font-size="8" text-anchor="end" fill="#666">+12m</text>
  
  <line x1="50" y1="294" x2="60" y2="294" stroke="#333" stroke-width="1"/>
  <text x="45" y="298" font-family="Arial" font-size="8" text-anchor="end" fill="#666">+18m</text>
  
  <line x1="50" y1="246" x2="60" y2="246" stroke="#333" stroke-width="1"/>
  <text x="45" y="250" font-family="Arial" font-size="8" text-anchor="end" fill="#666">+25m</text>
  
  <line x1="50" y1="40" x2="60" y2="40" stroke="#333" stroke-width="1"/>
  <text x="45" y="44" font-family="Arial" font-size="9" text-anchor="end" fill="#333">+54.6m</text>

  <!-- Chor (hinten, rechts) - zuerst zeichnen -->
  <rect x="450" y="294" width="130" height="126" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
  <polygon points="450,294 515,252 580,294" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
  <text x="515" y="370" font-family="Arial" font-size="9" text-anchor="middle" fill="#333">Chor (18m)</text>

  <!-- Seitenschiffe (links und rechts vom Hauptschiff) -->
  <rect x="200" y="336" width="60" height="84" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
  <polygon points="200,336 230,310 260,336" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
  
  <rect x="380" y="336" width="60" height="84" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
  <polygon points="380,336 410,310 440,336" fill="url(#hatch)" stroke="#333" stroke-width="1"/>

  <!-- Kirchenschiff (Hauptschiff, Mitte) -->
  <rect x="260" y="246" width="120" height="174" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
  <polygon points="260,246 320,200 380,246" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="350" font-family="Arial" font-size="9" text-anchor="middle" fill="#333">Kirchenschiff (25m)</text>

  <!-- Westturm (vorne, dominant) -->
  <rect x="100" y="40" width="100" height="380" fill="url(#hatch)" stroke="#333" stroke-width="2"/>
  <polygon points="100,40 150,20 200,40" fill="url(#hatch)" stroke="#333" stroke-width="2"/>
  
  <!-- Turm-Fenster (gotische Spitzbögen) -->
  <g fill="#FFF" stroke="#333" stroke-width="1">
    <!-- Schallfenster oben -->
    <path d="M125,60 L125,100 A12,15 0 0,0 150,100 L150,60 A12,15 0 0,0 125,60" fill="#FFF"/>
    <path d="M155,60 L155,100 A12,15 0 0,0 180,100 L180,60 A12,15 0 0,0 155,60" fill="#FFF"/>
    <!-- Fensterreihen -->
    <rect x="130" y="140" width="20" height="35"/>
    <rect x="160" y="140" width="20" height="35"/>
    <rect x="130" y="200" width="20" height="35"/>
    <rect x="160" y="200" width="20" height="35"/>
    <rect x="130" y="260" width="20" height="35"/>
    <rect x="160" y="260" width="20" height="35"/>
    <rect x="130" y="320" width="20" height="35"/>
    <rect x="160" y="320" width="20" height="35"/>
    <!-- Portal -->
    <path d="M125,380 L125,420 L175,420 L175,380 A25,30 0 0,0 125,380" fill="#FFF"/>
  </g>
  
  <text x="150" y="450" font-family="Arial" font-size="9" text-anchor="middle" fill="#333">Westturm (54.6m)</text>

  <!-- Gerüst am Turm -->
  <g stroke="#0066CC" stroke-width="2">
    <line x1="70" y1="420" x2="70" y2="20"/>
    <line x1="90" y1="420" x2="90" y2="20"/>
  </g>
  
  <!-- Gerüst-Beläge (alle 2m = 14px) -->
  <g fill="#8B4513">
    <rect x="68" y="406" width="24" height="3"/>
    <rect x="68" y="392" width="24" height="3"/>
    <rect x="68" y="378" width="24" height="3"/>
    <rect x="68" y="364" width="24" height="3"/>
    <rect x="68" y="350" width="24" height="3"/>
    <rect x="68" y="336" width="24" height="3"/>
    <rect x="68" y="322" width="24" height="3"/>
    <rect x="68" y="308" width="24" height="3"/>
    <rect x="68" y="294" width="24" height="3"/>
    <rect x="68" y="280" width="24" height="3"/>
    <rect x="68" y="266" width="24" height="3"/>
    <rect x="68" y="252" width="24" height="3"/>
    <rect x="68" y="238" width="24" height="3"/>
    <rect x="68" y="224" width="24" height="3"/>
    <rect x="68" y="210" width="24" height="3"/>
    <rect x="68" y="196" width="24" height="3"/>
    <rect x="68" y="182" width="24" height="3"/>
    <rect x="68" y="168" width="24" height="3"/>
    <rect x="68" y="154" width="24" height="3"/>
    <rect x="68" y="140" width="24" height="3"/>
    <rect x="68" y="126" width="24" height="3"/>
    <rect x="68" y="112" width="24" height="3"/>
    <rect x="68" y="98" width="24" height="3"/>
    <rect x="68" y="84" width="24" height="3"/>
    <rect x="68" y="70" width="24" height="3"/>
    <rect x="68" y="56" width="24" height="3"/>
    <rect x="68" y="42" width="24" height="3"/>
  </g>

  <!-- Verankerungen -->
  <g stroke="#CC0000" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="90" y1="100" x2="100" y2="100"/>
    <line x1="90" y1="150" x2="100" y2="150"/>
    <line x1="90" y1="200" x2="100" y2="200"/>
    <line x1="90" y1="250" x2="100" y2="250"/>
    <line x1="90" y1="300" x2="100" y2="300"/>
    <line x1="90" y1="350" x2="100" y2="350"/>
  </g>

  <!-- Lagenbeschriftung rechts -->
  <g font-family="Arial" font-size="8" fill="#666">
    <text x="655" y="410">1. Lage</text>
    <text x="655" y="340">6. Lage</text>
    <text x="655" y="270">11. Lage</text>
    <text x="655" y="200">16. Lage</text>
    <text x="655" y="130">21. Lage</text>
    <text x="655" y="60">26. Lage</text>
  </g>

  <!-- Terrain-Referenz -->
  <text x="350" y="445" font-family="Arial" font-size="9" text-anchor="middle" fill="#666">±0.00 = 533.5 m ü.M.</text>
</svg>
