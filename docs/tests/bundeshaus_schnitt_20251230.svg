<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Lockere Schraffur für Außenflächen -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8" stroke="#999" stroke-width="0.5"/>
    </pattern>

    <!-- Dichte Schraffur für Schnittflächen -->
    <pattern id="cut-hatch" patternUnits="userSpaceOnUse" width="4" height="4">
      <path d="M0,0 l4,4 M0,4 l4,-4" stroke="#666" stroke-width="0.8"/>
    </pattern>

    <!-- Terrain/Boden -->
    <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
      <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
    </pattern>

    <!-- Kupfer-Gradient NUR für Kuppeln -->
    <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB9A5"/>
      <stop offset="100%" style="stop-color:#4A8A77"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="700" height="480" fill="#FFFFFF"/>

  <!-- Titel -->
  <text x="350" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">
    GEBÄUDESCHNITT A-A - Bundeshaus
  </text>
  <text x="350" y="40" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">
    Bundesplatz 3, 3011 Bern | EGID: 2242547 | Maßstab 1:500
  </text>

  <!-- Terrain-Linie -->
  <rect x="50" y="400" width="600" height="20" fill="url(#ground)"/>
  <line x1="50" y1="400" x2="650" y2="400" stroke="#333" stroke-width="1"/>

  <!-- Höhenangaben -->
  <text x="40" y="405" text-anchor="end" font-family="Arial" font-size="8" fill="#666">±0.00</text>
  <text x="40" y="340" text-anchor="end" font-family="Arial" font-size="8" fill="#666">+6.0</text>
  <text x="40" y="200" text-anchor="end" font-family="Arial" font-size="8" fill="#666">+30.0</text>
  <text x="40" y="80" text-anchor="end" font-family="Arial" font-size="8" fill="#666">+64.0</text>

  <!-- Arkaden - geschnittene Mauern -->
  <rect x="100" y="340" width="20" height="60" fill="url(#cut-hatch)" stroke="#333" stroke-width="1"/>
  <rect x="580" y="340" width="20" height="60" fill="url(#cut-hatch)" stroke="#333" stroke-width="1"/>

  <!-- Arkaden-Bögen im Schnitt -->
  <path d="M120,400 Q150,360 180,400" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M520,400 Q550,360 580,400" fill="none" stroke="#333" stroke-width="1"/>

  <!-- Hauptgebäude - geschnittene Außenmauern -->
  <rect x="150" y="200" width="25" height="200" fill="url(#cut-hatch)" stroke="#333" stroke-width="1"/>
  <rect x="525" y="200" width="25" height="200" fill="url(#cut-hatch)" stroke="#333" stroke-width="1"/>

  <!-- Innenraum Hauptgebäude (weiß/leer) -->
  <rect x="175" y="200" width="350" height="200" fill="#FFFFFF" stroke="#333" stroke-width="1"/>

  <!-- Geschossdecken -->
  <line x1="175" y1="370" x2="525" y2="370" stroke="#333" stroke-width="1"/>
  <line x1="175" y1="340" x2="525" y2="340" stroke="#333" stroke-width="1"/>
  <line x1="175" y1="310" x2="525" y2="310" stroke="#333" stroke-width="1"/>
  <line x1="175" y1="280" x2="525" y2="280" stroke="#333" stroke-width="1"/>
  <line x1="175" y1="250" x2="525" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="175" y1="220" x2="525" y2="220" stroke="#333" stroke-width="1"/>

  <!-- Innenstützen -->
  <rect x="330" y="200" width="15" height="200" fill="url(#cut-hatch)"/>
  <rect x="355" y="200" width="15" height="200" fill="url(#cut-hatch)"/>

  <!-- Kuppel mit Kupfer-Gradient -->
  <path d="M 250,200 A 100,100 0 0,1 450,200 L 425,200 A 75,75 0 0,0 275,200 Z" fill="url(#copper)" stroke="#333" stroke-width="1"/>

  <!-- Kuppel-Innenraum -->
  <path d="M 275,200 A 75,75 0 0,1 425,200 L 425,200 L 275,200 Z" fill="#FFFFFF"/>

  <!-- Kuppelspitze -->
  <rect x="345" y="80" width="10" height="120" fill="url(#cut-hatch)" stroke="#333" stroke-width="1"/>

  <!-- Linkes Gerüst -->
  <g stroke="#0066CC" stroke-width="2" fill="none">
    <!-- Vertikale Stäbe -->
    <line x1="70" y1="70" x2="70" y2="420"/>
    <line x1="90" y1="70" x2="90" y2="420"/>

    <!-- Horizontale Beläge -->
    <line x1="70" y1="390" x2="90" y2="390" stroke="#8B4513" stroke-width="3"/>
    <line x1="70" y1="360" x2="90" y2="360" stroke="#8B4513" stroke-width="3"/>
    <line x1="70" y1="330" x2="90" y2="330" stroke="#8B4513" stroke-width="3"/>
    <line x1="70" y1="300" x2="90" y2="300" stroke="#8B4513" stroke-width="3"/>
    <line x1="70" y1="270" x2="90" y2="270" stroke="#8B4513" stroke-width="3"/>
    <line x1="70" y1="240" x2="90" y2="240" stroke="#8B4513" stroke-width="3"/>
    <line x1="70" y1="210" x2="90" y2="210" stroke="#8B4513" stroke-width="3"/>
    <line x1="70" y1="180" x2="90" y2="180" stroke="#8B4513" stroke-width="3"/>
    <line x1="70" y1="150" x2="90" y2="150" stroke="#8B4513" stroke-width="3"/>
    <line x1="70" y1="120" x2="90" y2="120" stroke="#8B4513" stroke-width="3"/>
    <line x1="70" y1="90" x2="90" y2="90" stroke="#8B4513" stroke-width="3"/>

    <!-- Verankerungen -->
    <line x1="90" y1="300" x2="150" y2="300" stroke="#CC0000" stroke-dasharray="3,3"/>
    <line x1="90" y1="240" x2="150" y2="240" stroke="#CC0000" stroke-dasharray="3,3"/>
    <line x1="90" y1="180" x2="150" y2="180" stroke="#CC0000" stroke-dasharray="3,3"/>
  </g>

  <!-- Rechtes Gerüst -->
  <g stroke="#0066CC" stroke-width="2" fill="none">
    <!-- Vertikale Stäbe -->
    <line x1="610" y1="70" x2="610" y2="420"/>
    <line x1="630" y1="70" x2="630" y2="420"/>

    <!-- Horizontale Beläge -->
    <line x1="610" y1="390" x2="630" y2="390" stroke="#8B4513" stroke-width="3"/>
    <line x1="610" y1="360" x2="630" y2="360" stroke="#8B4513" stroke-width="3"/>
    <line x1="610" y1="330" x2="630" y2="330" stroke="#8B4513" stroke-width="3"/>
    <line x1="610" y1="300" x2="630" y2="300" stroke="#8B4513" stroke-width="3"/>
    <line x1="610" y1="270" x2="630" y2="270" stroke="#8B4513" stroke-width="3"/>
    <line x1="610" y1="240" x2="630" y2="240" stroke="#8B4513" stroke-width="3"/>
    <line x1="610" y1="210" x2="630" y2="210" stroke="#8B4513" stroke-width="3"/>
    <line x1="610" y1="180" x2="630" y2="180" stroke="#8B4513" stroke-width="3"/>
    <line x1="610" y1="150" x2="630" y2="150" stroke="#8B4513" stroke-width="3"/>
    <line x1="610" y1="120" x2="630" y2="120" stroke="#8B4513" stroke-width="3"/>
    <line x1="610" y1="90" x2="630" y2="90" stroke="#8B4513" stroke-width="3"/>

    <!-- Verankerungen -->
    <line x1="610" y1="300" x2="550" y2="300" stroke="#CC0000" stroke-dasharray="3,3"/>
    <line x1="610" y1="240" x2="550" y2="240" stroke="#CC0000" stroke-dasharray="3,3"/>
    <line x1="610" y1="180" x2="550" y2="180" stroke="#CC0000" stroke-dasharray="3,3"/>
  </g>

  <!-- Schnittmarkierung -->
  <circle cx="100" cy="450" r="10" fill="#FFFFFF" stroke="#333" stroke-width="1"/>
  <text x="100" y="455" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">A</text>
  <circle cx="600" cy="450" r="10" fill="#FFFFFF" stroke="#333" stroke-width="1"/>
  <text x="600" y="455" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">A</text>

  <!-- Legende -->
  <g transform="translate(520, 60)">
    <rect x="0" y="0" width="120" height="80" fill="#FFFFFF" stroke="#333" stroke-width="1"/>
    <text x="5" y="15" font-family="Arial" font-size="10" font-weight="bold">LEGENDE</text>

    <rect x="5" y="20" width="15" height="8" fill="url(#cut-hatch)"/>
    <text x="25" y="28" font-family="Arial" font-size="8">Schnittfläche</text>

    <line x1="5" y1="35" x2="20" y2="35" stroke="#8B4513" stroke-width="3"/>
    <text x="25" y="38" font-family="Arial" font-size="8">Gerüstbelag</text>

    <line x1="5" y1="45" x2="20" y2="45" stroke="#CC0000" stroke-dasharray="2,2"/>
    <text x="25" y="48" font-family="Arial" font-size="8">Verankerung</text>

    <rect x="5" y="55" width="15" height="8" fill="url(#copper)"/>
    <text x="25" y="63" font-family="Arial" font-size="8">Kuppel</text>
  </g>
</svg>