<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8" stroke="#999" stroke-width="0.5"/>
    </pattern>
    <pattern id="cut-hatch" patternUnits="userSpaceOnUse" width="4" height="4">
      <path d="M0,0 l4,4 M0,4 l4,-4" stroke="#666" stroke-width="0.8"/>
    </pattern>
    <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
      <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Terrain -->
  <rect x="0" y="400" width="700" height="80" fill="url(#ground)" stroke="#666" stroke-width="0.5"/>
  <line x1="0" y1="400" x2="700" y2="400" stroke="#333" stroke-width="1"/>
  <text x="10" y="415" font-family="Arial" font-size="10" fill="#666">+/-0.00 = 533.5 m ü.M.</text>

  <!-- Westturm (links) -->
  <rect x="100" y="182" width="80" height="218" fill="url(#cut-hatch)" stroke="#333" stroke-width="2"/>
  <rect x="110" y="192" width="60" height="198" fill="#FFFFFF"/>

  <!-- Seitenschiff links -->
  <rect x="180" y="328" width="60" height="72" fill="url(#cut-hatch)" stroke="#333" stroke-width="2"/>
  <rect x="190" y="338" width="40" height="52" fill="#FFFFFF"/>

  <!-- Hauptschiff (Kirchenschiff) -->
  <rect x="240" y="250" width="220" height="150" fill="url(#cut-hatch)" stroke="#333" stroke-width="2"/>
  <rect x="250" y="260" width="200" height="130" fill="#FFFFFF"/>

  <!-- Seitenschiff rechts -->
  <rect x="460" y="328" width="60" height="72" fill="url(#cut-hatch)" stroke="#333" stroke-width="2"/>
  <rect x="470" y="338" width="40" height="52" fill="#FFFFFF"/>

  <!-- Chor -->
  <rect x="520" y="282" width="80" height="118" fill="url(#cut-hatch)" stroke="#333" stroke-width="2"/>
  <rect x="530" y="292" width="60" height="98" fill="#FFFFFF"/>

  <!-- Hauptschiff Dach (Satteldach 29°) -->
  <path d="M240,250 L350,200 L460,250 Z" fill="url(#cut-hatch)" stroke="#333" stroke-width="1"/>

  <!-- Westturm Dach -->
  <path d="M100,182 L140,162 L180,182 Z" fill="url(#cut-hatch)" stroke="#333" stroke-width="1"/>

  <!-- Seitenschiff Dächer -->
  <path d="M180,328 L220,318 L240,328 Z" fill="url(#cut-hatch)" stroke="#333" stroke-width="1"/>
  <path d="M460,328 L480,318 L520,328 Z" fill="url(#cut-hatch)" stroke="#333" stroke-width="1"/>

  <!-- Chor Dach -->
  <path d="M520,282 L560,272 L600,282 Z" fill="url(#cut-hatch)" stroke="#333" stroke-width="1"/>

  <!-- Geschossdecken im Hauptschiff -->
  <line x1="250" y1="340" x2="450" y2="340" stroke="#999" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="250" y1="310" x2="450" y2="310" stroke="#999" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Gerüst links -->
  <line x1="50" y1="150" x2="50" y2="400" stroke="#0066CC" stroke-width="3"/>
  <line x1="80" y1="150" x2="80" y2="400" stroke="#0066CC" stroke-width="3"/>
  <rect x="45" y="170" width="40" height="3" fill="#8B4513"/>
  <rect x="45" y="200" width="40" height="3" fill="#8B4513"/>
  <rect x="45" y="230" width="40" height="3" fill="#8B4513"/>
  <rect x="45" y="260" width="40" height="3" fill="#8B4513"/>
  <rect x="45" y="290" width="40" height="3" fill="#8B4513"/>
  <rect x="45" y="320" width="40" height="3" fill="#8B4513"/>
  <rect x="45" y="350" width="40" height="3" fill="#8B4513"/>
  <rect x="45" y="380" width="40" height="3" fill="#8B4513"/>

  <!-- Gerüst rechts -->
  <line x1="620" y1="260" x2="620" y2="400" stroke="#0066CC" stroke-width="3"/>
  <line x1="650" y1="260" x2="650" y2="400" stroke="#0066CC" stroke-width="3"/>
  <rect x="615" y="280" width="40" height="3" fill="#8B4513"/>
  <rect x="615" y="310" width="40" height="3" fill="#8B4513"/>
  <rect x="615" y="340" width="40" height="3" fill="#8B4513"/>
  <rect x="615" y="370" width="40" height="3" fill="#8B4513"/>

  <!-- Verankerungen -->
  <line x1="85" y1="250" x2="100" y2="250" stroke="#CC0000" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="180" y1="300" x2="190" y2="300" stroke="#CC0000" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="600" y1="300" x2="615" y2="300" stroke="#CC0000" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Maßlinien -->
  <line x1="100" y1="420" x2="180" y2="420" stroke="#666" stroke-width="0.5"/>
  <text x="140" y="435" font-family="Arial" font-size="8" text-anchor="middle" fill="#666">Turm</text>

  <line x1="240" y1="420" x2="460" y2="420" stroke="#666" stroke-width="0.5"/>
  <text x="350" y="435" font-family="Arial" font-size="8" text-anchor="middle" fill="#666">Hauptschiff</text>

  <!-- Höhenangaben -->
  <line x1="30" y1="182" x2="40" y2="182" stroke="#666" stroke-width="0.5"/>
  <text x="25" y="185" font-family="Arial" font-size="8" text-anchor="end" fill="#666">54.6m</text>

  <line x1="30" y1="250" x2="40" y2="250" stroke="#666" stroke-width="0.5"/>
  <text x="25" y="253" font-family="Arial" font-size="8" text-anchor="end" fill="#666">25.0m</text>

  <line x1="30" y1="400" x2="40" y2="400" stroke="#666" stroke-width="0.5"/>
  <text x="25" y="403" font-family="Arial" font-size="8" text-anchor="end" fill="#666">0.0m</text>

  <!-- Schnittlinie Markierung -->
  <text x="350" y="30" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Querschnitt A-A</text>
  <text x="350" y="45" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Kirche St. Peter und Paul, Rathausgasse 2, 3011 Bern</text>

  <!-- Legende -->
  <rect x="520" y="60" width="15" height="15" fill="url(#cut-hatch)" stroke="#666"/>
  <text x="540" y="72" font-family="Arial" font-size="8" fill="#666">Schnittflächen</text>

  <rect x="520" y="80" width="15" height="15" fill="#FFFFFF" stroke="#666"/>
  <text x="540" y="92" font-family="Arial" font-size="8" fill="#666">Innenräume</text>

  <line x1="520" y1="105" x2="535" y2="105" stroke="#0066CC" stroke-width="2"/>
  <text x="540" y="108" font-family="Arial" font-size="8" fill="#666">Gerüst</text>
</svg>