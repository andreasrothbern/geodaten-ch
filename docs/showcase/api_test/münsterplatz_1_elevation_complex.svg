  <polygon points="200,348 250,328 350,328 400,348" fill="url(#roof-hatch)" stroke="#333" stroke-width="1"/>
  
  <rect x="400" y="348" width="100" height="60" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
  <polygon points="400,348 450,328 550,328 600,348" fill="url(#roof-hatch)" stroke="#333" stroke-width="1"/>

  <!-- Kirchenschiff (Hauptgebäude) - 28m hoch -->
  <rect x="250" y="296" width="200" height="112" fill="url(#hatch)" stroke="#333" stroke-width="2"/>
  <line x1="250" y1="348" x2="450" y2="348" stroke="#666" stroke-width="0.5"/>
  <polygon points="250,296 350,266 450,296" fill="url(#roof-hatch)" stroke="#333" stroke-width="1"/>

