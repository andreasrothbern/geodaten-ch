<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Schraffur für Gebäude -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8 M-2,6 l4,4 M6,-2 l4,4" stroke="#999" stroke-width="0.5"/>
    </pattern>

    <!-- Terrain/Boden -->
    <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
      <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
    </pattern>

    <!-- Dach-Schraffur -->
    <pattern id="roof-hatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M0,0 l6,6 M-1,5 l3,3 M5,-1 l3,3" stroke="#777" stroke-width="0.5"/>
    </pattern>

    <!-- Kupfer-Gradient für Kuppeln -->
    <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB9A5"/>
      <stop offset="50%" style="stop-color:#5A9A87"/>
      <stop offset="100%" style="stop-color:#4A8A77"/>
    </linearGradient>

    <!-- Arkaden-Muster -->
    <pattern id="arcade" patternUnits="userSpaceOnUse" width="30" height="40">
      <path d="M5,40 L5,15 Q15,5 25,15 L25,40" fill="none" stroke="#666" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Weißer Hintergrund -->
  <rect width="700" height="480" fill="#FFFFFF"/>

  <!-- Terrain-Linie -->
  <line x1="0" y1="400" x2="700" y2="400" stroke="#333333" stroke-width="2"/>
  <rect x="0" y="400" width="700" height="80" fill="url(#ground)"/>

  <!-- Gerüst links -->
  <g stroke="#0066CC" stroke-width="2">
    <!-- Vertikale Ständer -->
    <line x1="80" y1="75" x2="80" y2="400"/>
    <line x1="110" y1="75" x2="110" y2="400"/>
    <!-- Horizontale Beläge alle 10m -->
    <g stroke="#8B4513" stroke-width="1.5">
      <line x1="80" y1="390" x2="110" y2="390"/>
      <line x1="80" y1="340" x2="110" y2="340"/>
      <line x1="80" y1="290" x2="110" y2="290"/>
      <line x1="80" y1="240" x2="110" y2="240"/>
      <line x1="80" y1="190" x2="110" y2="190"/>
      <line x1="80" y1="140" x2="110" y2="140"/>
      <line x1="80" y1="90" x2="110" y2="90"/>
    </g>
  </g>

  <!-- Gerüst rechts -->
  <g stroke="#0066CC" stroke-width="2">
    <!-- Vertikale Ständer -->
    <line x1="590" y1="75" x2="590" y2="400"/>
    <line x1="620" y1="75" x2="620" y2="400"/>
    <!-- Horizontale Beläge -->
    <g stroke="#8B4513" stroke-width="1.5">
      <line x1="590" y1="390" x2="620" y2="390"/>
      <line x1="590" y1="340" x2="620" y2="340"/>
      <line x1="590" y1="290" x2="620" y2="290"/>
      <line x1="590" y1="240" x2="620" y2="240"/>
      <line x1="590" y1="190" x2="620" y2="190"/>
      <line x1="590" y1="140" x2="620" y2="140"/>
      <line x1="590" y1="90" x2="620" y2="90"/>
    </g>
  </g>

  <!-- Verankerungen -->
  <g stroke="#CC0000" stroke-width="2" stroke-dasharray="5,3">
    <line x1="110" y1="340" x2="150" y2="340"/>
    <line x1="110" y1="240" x2="150" y2="240"/>
    <line x1="590" y1="340" x2="550" y2="340"/>
    <line x1="590" y1="240" x2="550" y2="240"/>
  </g>

  <!-- Arkaden (6.0m hoch) -->
  <rect x="150" y="370" width="400" height="30" fill="url(#hatch)" stroke="#333333" stroke-width="2"/>
  <!-- Arkaden-Bögen -->
  <g fill="none" stroke="#333333" stroke-width="1.5">
    <path d="M170,400 L170,385 Q185,375 200,385 L200,400"/>
    <path d="M220,400 L220,385 Q235,375 250,385 L250,400"/>
    <path d="M270,400 L270,385 Q285,375 300,385 L300,400"/>
    <path d="M320,400 L320,385 Q335,375 350,385 L350,400"/>
    <path d="M370,400 L370,385 Q385,375 400,385 L400,400"/>
    <path d="M420,400 L420,385 Q435,375 450,385 L450,400"/>
    <path d="M470,400 L470,385 Q485,375 500,385 L500,400"/>
    <path d="M520,400 L520,385 Q535,375 550,385 L550,400"/>
  </g>

  <!-- Hauptgebäude (25.0m hoch, Traufe 20m) -->
  <rect x="150" y="200" width="400" height="170" fill="url(#hatch)" stroke="#333333" stroke-width="2"/>
  
  <!-- Geschosslinien im Hauptgebäude -->
  <g stroke="#333333" stroke-width="1">
    <line x1="150" y1="320" x2="550" y2="320"/>
    <line x1="150" y1="260" x2="550" y2="260"/>
  </g>

  <!-- Satteldach des Hauptgebäudes -->
  <polygon points="150,200 350,180 550,200" fill="url(#roof-hatch)" stroke="#333333" stroke-width="2"/>

  <!-- Kuppel (64.0m hoch, ab Traufe 25m) -->
  <ellipse cx="350" cy="200" rx="120" ry="120" fill="url(#copper)" stroke="#333333" stroke-width="2"/>
  <!-- Kuppel nur obere Hälfte sichtbar -->
  <rect x="230" y="200" width="240" height="120" fill="url(#copper)"/>
  <path d="M230,200 Q350,80 470,200" fill="url(#copper)" stroke="#333333" stroke-width="2"/>

  <!-- Höhenkoten -->
  <g fill="#333333" font-family="Arial" font-size="12">
    <!-- Nulllinie -->
    <text x="20" y="405">+/-0.00</text>
    <!-- Arkaden Traufe -->
    <text x="560" y="375">+5.0m</text>
    <!-- Hauptgebäude Traufe -->
    <text x="560" y="205">+20.0m</text>
    <!-- Kuppel First -->
    <text x="560" y="85">+64.0m</text>
  </g>

  <!-- Höhenlinien -->
  <g stroke="#333333" stroke-width="1" stroke-dasharray="2,2">
    <line x1="550" y1="370" x2="580" y2="370"/>
    <line x1="550" y1="200" x2="580" y2="200"/>
    <line x1="470" y1="80" x2="580" y2="80"/>
  </g>

  <!-- Gebäude-Umrisse -->
  <g fill="none" stroke="#333333" stroke-width="2">
    <rect x="150" y="370" width="400" height="30"/>
    <rect x="150" y="200" width="400" height="170"/>
  </g>
</svg>