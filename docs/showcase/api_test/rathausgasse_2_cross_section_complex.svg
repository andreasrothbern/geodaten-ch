<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- Schraffur für Gebäude -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8 M-2,6 l4,4 M6,-2 l4,4" stroke="#999" stroke-width="0.5"/>
    </pattern>

    <!-- Terrain/Boden -->
    <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
      <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
    </pattern>

    <!-- Dach-Schraffur -->
    <pattern id="roof-hatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M0,0 l6,6 M-1,5 l3,3 M5,-1 l3,3" stroke="#777" stroke-width="0.5"/>
    </pattern>

    <!-- Kupfer-Gradient für Kuppeln -->
    <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB9A5"/>
      <stop offset="50%" style="stop-color:#5A9A87"/>
      <stop offset="100%" style="stop-color:#4A8A77"/>
    </linearGradient>

    <!-- Arkaden-Muster -->
    <pattern id="arcade" patternUnits="userSpaceOnUse" width="30" height="40">
      <path d="M5,40 L5,15 Q15,5 25,15 L25,40" fill="none" stroke="#666" stroke-width="1"/>
    </pattern>
</defs>

<!-- Hintergrund -->
<rect width="700" height="480" fill="#FFFFFF"/>

<!-- Terrain-Linie bei +/-0.00 -->
<line x1="0" y1="380" x2="700" y2="380" stroke="#333333" stroke-width="2"/>

<!-- Gerüst links (61m hoch, 30 Lagen) -->
<g>
  <!-- Vertikale Ständer -->
  <line x1="80" y1="380" x2="80" y2="75" stroke="#0066CC" stroke-width="2"/>
  <line x1="100" y1="380" x2="100" y2="75" stroke="#0066CC" stroke-width="2"/>
  
  <!-- Horizontale Beläge alle 2m -->
  <g stroke="#8B4513" stroke-width="1.5">
    <line x1="80" y1="370" x2="100" y2="370"/>
    <line x1="80" y1="360" x2="100" y2="360"/>
    <line x1="80" y1="350" x2="100" y2="350"/>
    <line x1="80" y1="340" x2="100" y2="340"/>
    <line x1="80" y1="330" x2="100" y2="330"/>
    <line x1="80" y1="320" x2="100" y2="320"/>
    <line x1="80" y1="310" x2="100" y2="310"/>
    <line x1="80" y1="300" x2="100" y2="300"/>
    <line x1="80" y1="290" x2="100" y2="290"/>
    <line x1="80" y1="280" x2="100" y2="280"/>
    <line x1="80" y1="270" x2="100" y2="270"/>
    <line x1="80" y1="260" x2="100" y2="260"/>
    <line x1="80" y1="250" x2="100" y2="250"/>
    <line x1="80" y1="240" x2="100" y2="240"/>
    <line x1="80" y1="230" x2="100" y2="230"/>
    <line x1="80" y1="220" x2="100" y2="220"/>
    <line x1="80" y1="210" x2="100" y2="210"/>
    <line x1="80" y1="200" x2="100" y2="200"/>
    <line x1="80" y1="190" x2="100" y2="190"/>
    <line x1="80" y1="180" x2="100" y2="180"/>
    <line x1="80" y1="170" x2="100" y2="170"/>
    <line x1="80" y1="160" x2="100" y2="160"/>
    <line x1="80" y1="150" x2="100" y2="150"/>
    <line x1="80" y1="140" x2="100" y2="140"/>
    <line x1="80" y1="130" x2="100" y2="130"/>
    <line x1="80" y1="120" x2="100" y2="120"/>
    <line x1="80" y1="110" x2="100" y2="110"/>
    <line x1="80" y1="100" x2="100" y2="100"/>
    <line x1="80" y1="90" x2="100" y2="90"/>
    <line x1="80" y1="80" x2="100" y2="80"/>
  </g>
</g>

<!-- Kirchenschiff (Hauptgebäude) -->
<g>
  <!-- Gebäudekörper bis Traufe 18m -->
  <rect x="120" y="290" width="280" height="90" fill="url(#hatch)" stroke="#333333" stroke-width="2"/>
  
  <!-- Geschosslinien -->
  <line x1="120" y1="350" x2="400" y2="350" stroke="#333333" stroke-width="1"/>
  <line x1="120" y1="320" x2="400" y2="320" stroke="#333333" stroke-width="1"/>
  
  <!-- Satteldach bis 22m -->
  <polygon points="120,290 260,270 400,290" fill="url(#roof-hatch)" stroke="#333333" stroke-width="2"/>
</g>

<!-- Doppeltürme -->
<g>
  <!-- Linker Turm -->
  <rect x="120" y="200" width="60" height="90" fill="url(#hatch)" stroke="#333333" stroke-width="2"/>
  <!-- Turmdach bis 60m -->
  <polygon points="120,200 150,80 180,200" fill="url(#roof-hatch)" stroke="#333333" stroke-width="2"/>
  
  <!-- Rechter Turm -->
  <rect x="340" y="200" width="60" height="90" fill="url(#hatch)" stroke="#333333" stroke-width="2"/>
  <!-- Turmdach bis 60m -->
  <polygon points="340,200 370,80 400,200" fill="url(#roof-hatch)" stroke="#333333" stroke-width="2"/>
</g>

<!-- Gerüst rechts -->
<g>
  <!-- Vertikale Ständer -->
  <line x1="600" y1="380" x2="600" y2="75" stroke="#0066CC" stroke-width="2"/>
  <line x1="620" y1="380" x2="620" y2="75" stroke="#0066CC" stroke-width="2"/>
  
  <!-- Horizontale Beläge alle 2m -->
  <g stroke="#8B4513" stroke-width="1.5">
    <line x1="600" y1="370" x2="620" y2="370"/>
    <line x1="600" y1="360" x2="620" y2="360"/>
    <line x1="600" y1="350" x2="620" y2="350"/>
    <line x1="600" y1="340" x2="620" y2="340"/>
    <line x1="600" y1="330" x2="620" y2="330"/>
    <line x1="600" y1="320" x2="620" y2="320"/>
    <line x1="600" y1="310" x2="620" y2="310"/>
    <line x1="600" y1="300" x2="620" y2="300"/>
    <line x1="600" y1="290" x2="620" y2="290"/>
    <line x1="600" y1="280" x2="620" y2="280"/>
    <line x1="600" y1="270" x2="620" y2="270"/>
    <line x1="600" y1="260" x2="620" y2="260"/>
    <line x1="600" y1="250" x2="620" y2="250"/>
    <line x1="600" y1="240" x2="620" y2="240"/>
    <line x1="600" y1="230" x2="620" y2="230"/>
    <line x1="600" y1="220" x2="620" y2="220"/>
    <line x1="600" y1="210" x2="620" y2="210"/>
    <line x1="600" y1="200" x2="620" y2="200"/>
    <line x1="600" y1="190" x2="620" y2="190"/>
    <line x1="600" y1="180" x2="620" y2="180"/>
    <line x1="600" y1="170" x2="620" y2="170"/>
    <line x1="600" y1="160" x2="620" y2="160"/>
    <line x1="600" y1="150" x2="620" y2="150"/>
    <line x1="600" y1="140" x2="620" y2="140"/>
    <line x1="600" y1="130" x2="620" y2="130"/>
    <line x1="600" y1="120" x2="620" y2="120"/>
    <line x1="600" y1="110" x2="620" y2="110"/>
    <line x1="600" y1="100" x2="620" y2="100"/>
    <line x1="600" y1="90" x2="620" y2="90"/>
    <line x1="600" y1="80" x2="620" y2="80"/>
  </g>
</g>

<!-- Verankerungslinien -->
<g stroke="#CC0000" stroke-width="1" stroke-dasharray="3,3">
  <line x1="100" y1="290" x2="120" y2="290"/>
  <line x1="100" y1="200" x2="120" y2="200"/>
  <line x1="400" y1="290" x2="600" y2="290"/>
  <line x1="400" y1="200" x2="600" y2="200"/>
</g>

<!-- Höhenkoten -->
<g fill="#333333" font-family="Arial, sans-serif" font-size="12">
  <text x="50" y="385">±0.00</text>
  <text x="50" y="295">+18.0m</text>
  <text x="50" y="275">+22.0m</text>
  <text x="50" y="205">+46.4m</text>
  <text x="50" y="85">+60.0m</text>
</g>

</svg>