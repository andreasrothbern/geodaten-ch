<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- Schraffur für Gebäude -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8 M-2,6 l4,4 M6,-2 l4,4" stroke="#999" stroke-width="0.5"/>
    </pattern>

    <!-- Terrain/Boden -->
    <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
      <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
    </pattern>

    <!-- Dach-Schraffur -->
    <pattern id="roof-hatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M0,0 l6,6 M-1,5 l3,3 M5,-1 l3,3" stroke="#777" stroke-width="0.5"/>
    </pattern>
</defs>

<!-- Weisser Hintergrund -->
<rect width="700" height="480" fill="#FFFFFF"/>

<!-- Terrain-Linie -->
<line x1="0" y1="350" x2="700" y2="350" stroke="#333333" stroke-width="2"/>
<rect x="0" y="350" width="700" height="130" fill="url(#ground)"/>

<!-- Gerüst links -->
<g stroke="#0066CC" stroke-width="2" fill="none">
    <!-- Vertikale Ständer -->
    <line x1="150" y1="350" x2="150" y2="124"/>
    <line x1="170" y1="350" x2="170" y2="124"/>
    <!-- Horizontale Beläge -->
    <g stroke="#8B4513" stroke-width="1.5">
        <line x1="150" y1="350" x2="170" y2="350"/>
        <line x1="150" y1="330" x2="170" y2="330"/>
        <line x1="150" y1="310" x2="170" y2="310"/>
        <line x1="150" y1="290" x2="170" y2="290"/>
        <line x1="150" y1="270" x2="170" y2="270"/>
        <line x1="150" y1="250" x2="170" y2="250"/>
        <line x1="150" y1="230" x2="170" y2="230"/>
        <line x1="150" y1="210" x2="170" y2="210"/>
        <line x1="150" y1="190" x2="170" y2="190"/>
        <line x1="150" y1="170" x2="170" y2="170"/>
        <line x1="150" y1="150" x2="170" y2="150"/>
        <line x1="150" y1="130" x2="170" y2="130"/>
    </g>
</g>

<!-- Gerüst rechts -->
<g stroke="#0066CC" stroke-width="2" fill="none">
    <!-- Vertikale Ständer -->
    <line x1="530" y1="350" x2="530" y2="124"/>
    <line x1="550" y1="350" x2="550" y2="124"/>
    <!-- Horizontale Beläge -->
    <g stroke="#8B4513" stroke-width="1.5">
        <line x1="530" y1="350" x2="550" y2="350"/>
        <line x1="530" y1="330" x2="550" y2="330"/>
        <line x1="530" y1="310" x2="550" y2="310"/>
        <line x1="530" y1="290" x2="550" y2="290"/>
        <line x1="530" y1="270" x2="550" y2="270"/>
        <line x1="530" y1="250" x2="550" y2="250"/>
        <line x1="530" y1="230" x2="550" y2="230"/>
        <line x1="530" y1="210" x2="550" y2="210"/>
        <line x1="530" y1="190" x2="550" y2="190"/>
        <line x1="530" y1="170" x2="550" y2="170"/>
        <line x1="530" y1="150" x2="550" y2="150"/>
        <line x1="530" y1="130" x2="550" y2="130"/>
    </g>
</g>

<!-- Südlicher Anbau -->
<rect x="190" y="210" width="120" height="140" fill="url(#hatch)" stroke="#333333" stroke-width="2"/>
<!-- Geschosslinien Anbau -->
<line x1="190" y1="325" x2="310" y2="325" stroke="#333333" stroke-width="1"/>
<line x1="190" y1="295" x2="310" y2="295" stroke="#333333" stroke-width="1"/>
<line x1="190" y1="265" x2="310" y2="265" stroke="#333333" stroke-width="1"/>
<line x1="190" y1="235" x2="310" y2="235" stroke="#333333" stroke-width="1"/>
<!-- Dach Anbau -->
<polygon points="190,210 250,180 310,210" fill="url(#roof-hatch)" stroke="#333333" stroke-width="2"/>

<!-- Hauptgebäude -->
<rect x="310" y="134" width="180" height="216" fill="url(#hatch)" stroke="#333333" stroke-width="2"/>
<!-- Geschosslinien Hauptgebäude -->
<line x1="310" y1="314" x2="490" y2="314" stroke="#333333" stroke-width="1"/>
<line x1="310" y1="278" x2="490" y2="278" stroke="#333333" stroke-width="1"/>
<line x1="310" y1="242" x2="490" y2="242" stroke="#333333" stroke-width="1"/>
<line x1="310" y1="206" x2="490" y2="206" stroke="#333333" stroke-width="1"/>
<line x1="310" y1="170" x2="490" y2="170" stroke="#333333" stroke-width="1"/>
<!-- Dach Hauptgebäude -->
<polygon points="310,134 400,102 490,134" fill="url(#roof-hatch)" stroke="#333333" stroke-width="2"/>

<!-- Verankerung -->
<line x1="170" y1="250" x2="310" y2="250" stroke="#CC0000" stroke-width="2" stroke-dasharray="4,4"/>
<line x1="490" y1="250" x2="530" y2="250" stroke="#CC0000" stroke-width="2" stroke-dasharray="4,4"/>

<!-- Höhenkoten -->
<text x="50" y="355" font-family="Arial" font-size="12" fill="#333333">+/-0.00</text>
<text x="50" y="215" font-family="Arial" font-size="12" fill="#333333">+15.0m</text>
<text x="50" y="185" font-family="Arial" font-size="12" fill="#333333">+17.5m</text>
<text x="50" y="139" font-family="Arial" font-size="12" fill="#333333">+18.4m</text>
<text x="50" y="107" font-family="Arial" font-size="12" fill="#333333">+21.6m</text>
<text x="580" y="129" font-family="Arial" font-size="12" fill="#333333">+22.6m</text>

</svg>