<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- Schraffur für Gebäude -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8 M-2,6 l4,4 M6,-2 l4,4" stroke="#999" stroke-width="0.5"/>
    </pattern>

    <!-- Terrain/Boden -->
    <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
      <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
    </pattern>

    <!-- Dach-Schraffur -->
    <pattern id="roof-hatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M0,0 l6,6 M-1,5 l3,3 M5,-1 l3,3" stroke="#777" stroke-width="0.5"/>
    </pattern>

    <!-- Kupfer-Gradient für Kuppeln -->
    <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB9A5"/>
      <stop offset="50%" style="stop-color:#5A9A87"/>
      <stop offset="100%" style="stop-color:#4A8A77"/>
    </linearGradient>

    <!-- Arkaden-Muster -->
    <pattern id="arcade" patternUnits="userSpaceOnUse" width="30" height="40">
      <path d="M5,40 L5,15 Q15,5 25,15 L25,40" fill="none" stroke="#666" stroke-width="1"/>
    </pattern>
</defs>

<!-- Weisser Hintergrund -->
<rect width="100%" height="100%" fill="#FFFFFF"/>

<!-- Terrain -->
<rect x="0" y="408" width="700" height="72" fill="url(#ground)" stroke="#333" stroke-width="1"/>

<!-- Hauptgebäude -->
<rect x="200" y="168" width="213" height="184" fill="url(#hatch)" stroke="#333" stroke-width="2"/>

<!-- Geschosslinien -->
<line x1="200" y1="199" x2="413" y2="199" stroke="#333" stroke-width="1"/>
<line x1="200" y1="230" x2="413" y2="230" stroke="#333" stroke-width="1"/>
<line x1="200" y1="261" x2="413" y2="261" stroke="#333" stroke-width="1"/>
<line x1="200" y1="292" x2="413" y2="292" stroke="#333" stroke-width="1"/>
<line x1="200" y1="323" x2="413" y2="323" stroke="#333" stroke-width="1"/>

<!-- Satteldach -->
<polygon points="200,168 306.5,136 413,168" fill="url(#roof-hatch)" stroke="#333" stroke-width="2"/>

<!-- Gerüst -->
<!-- Vertikale Ständer -->
<line x1="170" y1="115" x2="170" y2="408" stroke="#0066CC" stroke-width="3"/>
<line x1="190" y1="115" x2="190" y2="408" stroke="#0066CC" stroke-width="3"/>
<line x1="443" y1="115" x2="443" y2="408" stroke="#0066CC" stroke-width="3"/>
<line x1="463" y1="115" x2="463" y2="408" stroke="#0066CC" stroke-width="3"/>

<!-- Horizontale Beläge (11 Lagen) -->
<rect x="170" y="115" width="293" height="4" fill="#8B4513" stroke="#333" stroke-width="0.5"/>
<rect x="170" y="141" width="293" height="4" fill="#8B4513" stroke="#333" stroke-width="0.5"/>
<rect x="170" y="167" width="293" height="4" fill="#8B4513" stroke="#333" stroke-width="0.5"/>
<rect x="170" y="193" width="293" height="4" fill="#8B4513" stroke="#333" stroke-width="0.5"/>
<rect x="170" y="219" width="293" height="4" fill="#8B4513" stroke="#333" stroke-width="0.5"/>
<rect x="170" y="245" width="293" height="4" fill="#8B4513" stroke="#333" stroke-width="0.5"/>
<rect x="170" y="271" width="293" height="4" fill="#8B4513" stroke="#333" stroke-width="0.5"/>
<rect x="170" y="297" width="293" height="4" fill="#8B4513" stroke="#333" stroke-width="0.5"/>
<rect x="170" y="323" width="293" height="4" fill="#8B4513" stroke="#333" stroke-width="0.5"/>
<rect x="170" y="349" width="293" height="4" fill="#8B4513" stroke="#333" stroke-width="0.5"/>
<rect x="170" y="375" width="293" height="4" fill="#8B4513" stroke="#333" stroke-width="0.5"/>

<!-- Verankerungen (alle 4m vertikal) -->
<line x1="200" y1="193" x2="190" y2="193" stroke="#CC0000" stroke-width="2" stroke-dasharray="5,5"/>
<line x1="413" y1="193" x2="443" y2="193" stroke="#CC0000" stroke-width="2" stroke-dasharray="5,5"/>
<line x1="200" y1="271" x2="190" y2="271" stroke="#CC0000" stroke-width="2" stroke-dasharray="5,5"/>
<line x1="413" y1="271" x2="443" y2="271" stroke="#CC0000" stroke-width="2" stroke-dasharray="5,5"/>
<line x1="200" y1="349" x2="190" y2="349" stroke="#CC0000" stroke-width="2" stroke-dasharray="5,5"/>
<line x1="413" y1="349" x2="443" y2="349" stroke="#CC0000" stroke-width="2" stroke-dasharray="5,5"/>

<!-- Höhenskala links -->
<text x="50" y="412" font-family="Arial" font-size="14" fill="#333">+0</text>
<text x="50" y="310" font-family="Arial" font-size="14" fill="#333">+10</text>
<text x="50" y="208" font-family="Arial" font-size="14" fill="#333">+20</text>
<text x="50" y="106" font-family="Arial" font-size="14" fill="#333">+30</text>

<!-- Höhenlinien -->
<line x1="70" y1="408" x2="100" y2="408" stroke="#333" stroke-width="1"/>
<line x1="70" y1="306" x2="100" y2="306" stroke="#333" stroke-width="1"/>
<line x1="70" y1="204" x2="100" y2="204" stroke="#333" stroke-width="1"/>
<line x1="70" y1="102" x2="100" y2="102" stroke="#333" stroke-width="1"/>

<!-- Lagenbeschriftung rechts -->
<text x="500" y="122" font-family="Arial" font-size="12" fill="#333">11. Lage</text>
<text x="500" y="148" font-family="Arial" font-size="12" fill="#333">10. Lage</text>
<text x="500" y="174" font-family="Arial" font-size="12" fill="#333">9. Lage</text>
<text x="500" y="200" font-family="Arial" font-size="12" fill="#333">8. Lage</text>
<text x="500" y="226" font-family="Arial" font-size="12" fill="#333">7. Lage</text>
<text x="500" y="252" font-family="Arial" font-size="12" fill="#333">6. Lage</text>
<text x="500" y="278" font-family="Arial" font-size="12" fill="#333">5. Lage</text>
<text x="500" y="304" font-family="Arial" font-size="12" fill="#333">4. Lage</text>
<text x="500" y="330" font-family="Arial" font-size="12" fill="#333">3. Lage</text>
<text x="500" y="356" font-family="Arial" font-size="12" fill="#333">2. Lage</text>
<text x="500" y="382" font-family="Arial" font-size="12" fill="#333">1. Lage</text>
</svg>