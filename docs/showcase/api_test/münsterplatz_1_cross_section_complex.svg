<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- Schraffur für Gebäude -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8 M-2,6 l4,4 M6,-2 l4,4" stroke="#999" stroke-width="0.5"/>
    </pattern>

    <!-- Terrain/Boden -->
    <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
      <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
    </pattern>

    <!-- Dach-Schraffur -->
    <pattern id="roof-hatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M0,0 l6,6 M-1,5 l3,3 M5,-1 l3,3" stroke="#777" stroke-width="0.5"/>
    </pattern>

    <!-- Kupfer-Gradient für Kuppeln -->
    <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB9A5"/>
      <stop offset="50%" style="stop-color:#5A9A87"/>
      <stop offset="100%" style="stop-color:#4A8A77"/>
    </linearGradient>
</defs>

<!-- Weisser Hintergrund -->
<rect width="700" height="480" fill="#FFFFFF"/>

<!-- Terrain-Linie -->
<line x1="0" y1="400" x2="700" y2="400" stroke="#666" stroke-width="2"/>
<rect x="0" y="400" width="700" height="80" fill="url(#ground)"/>

<!-- Gerüst links -->
<g stroke="#0066CC" stroke-width="1.5" fill="none">
  <!-- Vertikale Ständer -->
  <line x1="100" y1="400" x2="100" y2="20"/>
  <line x1="110" y1="400" x2="110" y2="20"/>
  <!-- Horizontale Beläge alle 2m -->
  <g stroke="#8B4513" stroke-width="1">
    <line x1="100" y1="400" x2="110" y2="400"/>
    <line x1="100" y1="380" x2="110" y2="380"/>
    <line x1="100" y1="360" x2="110" y2="360"/>
    <line x1="100" y1="340" x2="110" y2="340"/>
    <line x1="100" y1="320" x2="110" y2="320"/>
    <line x1="100" y1="300" x2="110" y2="300"/>
    <line x1="100" y1="280" x2="110" y2="280"/>
    <line x1="100" y1="260" x2="110" y2="260"/>
    <line x1="100" y1="240" x2="110" y2="240"/>
    <line x1="100" y1="220" x2="110" y2="220"/>
    <line x1="100" y1="200" x2="110" y2="200"/>
    <line x1="100" y1="180" x2="110" y2="180"/>
    <line x1="100" y1="160" x2="110" y2="160"/>
    <line x1="100" y1="140" x2="110" y2="140"/>
    <line x1="100" y1="120" x2="110" y2="120"/>
    <line x1="100" y1="100" x2="110" y2="100"/>
    <line x1="100" y1="80" x2="110" y2="80"/>
    <line x1="100" y1="60" x2="110" y2="60"/>
    <line x1="100" y1="40" x2="110" y2="40"/>
    <line x1="100" y1="20" x2="110" y2="20"/>
  </g>
</g>

<!-- Seitenkapellen (Anbau) links -->
<rect x="120" y="340" width="80" height="60" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
<!-- Dach Seitenkapellen -->
<polygon points="120,340 160,320 200,340" fill="url(#roof-hatch)" stroke="#333" stroke-width="1.5"/>

<!-- Kirchenschiff (Hauptgebäude) -->
<rect x="200" y="288" width="120" height="112" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
<!-- Satteldach Kirchenschiff -->
<polygon points="200,288 260,248 320,288" fill="url(#roof-hatch)" stroke="#333" stroke-width="1.5"/>
<!-- Geschosslinie -->
<line x1="200" y1="380" x2="320" y2="380" stroke="#333" stroke-width="0.5"/>

<!-- Turm -->
<rect x="340" y="20" width="40" height="380" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
<!-- Spitzdach Turm -->
<polygon points="340,20 360,5 380,20" fill="url(#roof-hatch)" stroke="#333" stroke-width="1.5"/>
<!-- Geschosslinien Turm -->
<line x1="340" y1="380" x2="380" y2="380" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="360" x2="380" y2="360" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="340" x2="380" y2="340" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="320" x2="380" y2="320" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="300" x2="380" y2="300" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="280" x2="380" y2="280" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="260" x2="380" y2="260" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="240" x2="380" y2="240" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="220" x2="380" y2="220" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="200" x2="380" y2="200" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="180" x2="380" y2="180" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="160" x2="380" y2="160" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="140" x2="380" y2="140" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="120" x2="380" y2="120" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="100" x2="380" y2="100" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="80" x2="380" y2="80" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="60" x2="380" y2="60" stroke="#333" stroke-width="0.5"/>
<line x1="340" y1="40" x2="380" y2="40" stroke="#333" stroke-width="0.5"/>

<!-- Seitenkapellen (Anbau) rechts -->
<rect x="420" y="340" width="80" height="60" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
<!-- Dach Seitenkapellen -->
<polygon points="420,340 460,320 500,340" fill="url(#roof-hatch)" stroke="#333" stroke-width="1.5"/>

<!-- Gerüst rechts -->
<g stroke="#0066CC" stroke-width="1.5" fill="none">
  <!-- Vertikale Ständer -->
  <line x1="590" y1="400" x2="590" y2="20"/>
  <line x1="600" y1="400" x2="600" y2="20"/>
  <!-- Horizontale Beläge alle 2m -->
  <g stroke="#8B4513" stroke-width="1">
    <line x1="590" y1="400" x2="600" y2="400"/>
    <line x1="590" y1="380" x2="600" y2="380"/>
    <line x1="590" y1="360" x2="600" y2="360"/>
    <line x1="590" y1="340" x2="600" y2="340"/>
    <line x1="590" y1="320" x2="600" y2="320"/>
    <line x1="590" y1="300" x2="600" y2="300"/>
    <line x1="590" y1="280" x2="600" y2="280"/>
    <line x1="590" y1="260" x2="600" y2="260"/>
    <line x1="590" y1="240" x2="600" y2="240"/>
    <line x1="590" y1="220" x2="600" y2="220"/>
    <line x1="590" y1="200" x2="600" y2="200"/>
    <line x1="590" y1="180" x2="600" y2="180"/>
    <line x1="590" y1="160" x2="600" y2="160"/>
    <line x1="590" y1="140" x2="600" y2="140"/>
    <line x1="590" y1="120" x2="600" y2="120"/>
    <line x1="590" y1="100" x2="600" y2="100"/>
    <line x1="590" y1="80" x2="600" y2="80"/>
    <line x1="590" y1="60" x2="600" y2="60"/>
    <line x1="590" y1="40" x2="600" y2="40"/>
    <line x1="590" y1="20" x2="600" y2="20"/>
  </g>
</g>

<!-- Verankerungen -->
<line x1="110" y1="100" x2="340" y2="100" stroke="#CC0000" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="380" y1="100" x2="590" y2="100" stroke="#CC0000" stroke-width="1" stroke-dasharray="3,2"/>

<!-- Höhenkoten -->
<text x="50" y="405" fill="#333" font-size="10" font-family="Arial">+/-0.00</text>
<text x="50" y="325" fill="#333" font-size="10" font-family="Arial">+12.0m</text>
<text x="50" y="293" fill="#333" font-size="10" font-family="Arial">+20.0m</text>
<text x="50" y="25" fill="#333" font-size="10" font-family="Arial">+95.0m</text>
<text x="50" y="10" fill="#333" font-size="10" font-family="Arial">+100.3m</text>

<!-- Zonenbeschriftung -->
<text x="160" y="430" fill="#333" font-size="12" font-family="Arial">Seitenkapellen</text>
<text x="235" y="430" fill="#333" font-size="12" font-family="Arial">Kirchenschiff</text>
<text x="345" y="430" fill="#333" font-size="12" font-family="Arial">Turm</text>
<text x="455" y="430" fill="#333" font-size="12" font-family="Arial">Seitenkapellen</text>

</svg>