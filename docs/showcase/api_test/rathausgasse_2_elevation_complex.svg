<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- Schraffur für Gebäude -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8 M-2,6 l4,4 M6,-2 l4,4" stroke="#999" stroke-width="0.5"/>
    </pattern>

    <!-- Terrain/Boden -->
    <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
      <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
    </pattern>

    <!-- Dach-Schraffur -->
    <pattern id="roof-hatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M0,0 l6,6 M-1,5 l3,3 M5,-1 l3,3" stroke="#777" stroke-width="0.5"/>
    </pattern>
</defs>

<!-- Weisser Hintergrund -->
<rect width="100%" height="100%" fill="#FFFFFF"/>

<!-- Terrain -->
<rect x="0" y="408" width="700" height="72" fill="url(#ground)" stroke="#333" stroke-width="1"/>

<!-- Kirchenschiff (Hauptgebäude) - 22m hoch, 18m Traufe -->
<rect x="180" y="298" width="340" height="110" fill="url(#hatch)" stroke="#333" stroke-width="2"/>

<!-- Satteldach für Kirchenschiff -->
<polygon points="180,298 350,268 520,298" fill="url(#roof-hatch)" stroke="#333" stroke-width="2"/>

<!-- Geschosslinien im Kirchenschiff -->
<line x1="180" y1="335" x2="520" y2="335" stroke="#333" stroke-width="1"/>
<line x1="180" y1="372" x2="520" y2="372" stroke="#333" stroke-width="1"/>

<!-- Doppeltürme - 60m hoch, 46.4m Traufe -->
<!-- Linker Turm -->
<rect x="220" y="138" width="60" height="270" fill="url(#hatch)" stroke="#333" stroke-width="2"/>
<polygon points="220,138 250,118 280,138" fill="url(#roof-hatch)" stroke="#333" stroke-width="2"/>

<!-- Rechter Turm -->
<rect x="420" y="138" width="60" height="270" fill="url(#hatch)" stroke="#333" stroke-width="2"/>
<polygon points="420,138 450,118 480,138" fill="url(#roof-hatch)" stroke="#333" stroke-width="2"/>

