<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- Schraffur für Gebäude -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 l8,8 M-2,6 l4,4 M6,-2 l4,4" stroke="#999" stroke-width="0.5"/>
    </pattern>

    <!-- Terrain/Boden -->
    <pattern id="ground" patternUnits="userSpaceOnUse" width="20" height="10">
      <path d="M0,10 L10,0 M10,10 L20,0" stroke="#666" stroke-width="0.5"/>
    </pattern>

    <!-- Dach-Schraffur -->
    <pattern id="roof-hatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M0,0 l6,6 M-1,5 l3,3 M5,-1 l3,3" stroke="#777" stroke-width="0.5"/>
    </pattern>

    <!-- Kupfer-Gradient für Kuppeln -->
    <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB9A5"/>
      <stop offset="50%" style="stop-color:#5A9A87"/>
      <stop offset="100%" style="stop-color:#4A8A77"/>
    </linearGradient>
</defs>

<!-- Weißer Hintergrund -->
<rect width="100%" height="100%" fill="#FFFFFF"/>

<!-- Terrain -->
<rect x="0" y="408" width="700" height="72" fill="url(#ground)" stroke="#666" stroke-width="1"/>

<!-- Gebäude Arkaden (6m) -->
<rect x="300" y="378" width="100" height="30" fill="url(#hatch)" stroke="#333" stroke-width="1"/>
<!-- Arkaden Bögen -->
<path d="M310,408 Q320,388 330,408 M330,408 Q340,388 350,408 M350,408 Q360,388 370,408 M370,408 Q380,388 390,408" stroke="#666" stroke-width="1" fill="none"/>

<!-- Hauptgebäude (25m) -->
<rect x="290" y="258" width="120" height="120" fill="url(#hatch)" stroke="#333" stroke-width="2"/>
<!-- Geschosslinien -->
<line x1="290" y1="298" x2="410" y2="298" stroke="#333" stroke-width="0.5"/>
<line x1="290" y1="338" x2="410" y2="338" stroke="#333" stroke-width="0.5"/>
<!-- Satteldach -->
<polygon points="285,258 350,218 415,258" fill="url(#roof-hatch)" stroke="#333" stroke-width="1"/>

<!-- Kuppel (64m) -->
<ellipse cx="350" cy="258" rx="60" ry="100" fill="url(#copper)" stroke="#333" stroke-width="2"/>

<!-- Gerüst -->
<!-- Vertikale Ständer -->
