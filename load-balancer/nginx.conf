# =============================================================================
# Geodaten-CH Load Balancer
# =============================================================================
# Routing: GET → Reader (Round-Robin), POST/PUT/DELETE → Writer
# Stand: 07.02.2026
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # =========================================================================
    # UPSTREAM DEFINITIONS
    # =========================================================================
    # Railway: Interne Hostnamen werden via Environment-Variablen gesetzt
    # Default: localhost für lokales Testing

    upstream writer {
        server ${WRITER_HOST}:${WRITER_PORT};
    }

    upstream readers {
        least_conn;
        server ${READER1_HOST}:${READER1_PORT};
        server ${READER2_HOST}:${READER2_PORT};
        server ${READER3_HOST}:${READER3_PORT};
    }

    server {
        listen 8080;
        server_name _;

        # =====================================================================
        # TIMEOUTS (für SSE-Streams)
        # =====================================================================
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # =====================================================================
        # COMMON PROXY SETTINGS
        # =====================================================================
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # =====================================================================
        # HEALTH CHECK
        # =====================================================================
        location = /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # =====================================================================
        # SSE STREAMS (GET, spezielle Behandlung)
        # =====================================================================
        # SSE-Streams brauchen längere Timeouts und spezielle Header

        location ~ ^/api/v1/geruestbau/building/data/stream {
            proxy_pass http://readers;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
        }

        location ~ ^/api/v1/geruestbau/projects/[^/]+/context/stream {
            proxy_pass http://readers;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
        }

        # =====================================================================
        # WRITER ROUTES (POST, PUT, DELETE)
        # =====================================================================

        # Projekt CRUD
        location = /api/v1/geruestbau/projects {
            if ($request_method = POST) {
                proxy_pass http://writer;
                break;
            }
            proxy_pass http://readers;
        }

        location ~ ^/api/v1/geruestbau/projects/([^/]+)$ {
            if ($request_method ~ ^(PUT|DELETE)$) {
                proxy_pass http://writer;
                break;
            }
            proxy_pass http://readers;
        }

        # Projekt Sub-Resources (POST, PUT, DELETE → Writer)
        location ~ ^/api/v1/geruestbau/projects/([^/]+)/(photos|uploads|scaffold|geruestbaudata|export) {
            if ($request_method ~ ^(POST|PUT|DELETE)$) {
                proxy_pass http://writer;
                break;
            }
            proxy_pass http://readers;
        }

        # Foto-Analyse
        location ~ ^/api/v1/geruestbau/projects/([^/]+)/photos/([^/]+)/analyze$ {
            proxy_pass http://writer;
        }

        # Uploads löschen
        location ~ ^/api/v1/geruestbau/uploads/([^/]+)$ {
            if ($request_method = DELETE) {
                proxy_pass http://writer;
                break;
            }
            proxy_pass http://readers;
        }

        # Batch Import (immer Writer)
        location ~ ^/api/v1/batch/import/(region|tile)/ {
            proxy_pass http://writer;
        }

        # =====================================================================
        # READER ROUTES (alle anderen API-Requests)
        # =====================================================================

        location /api/ {
            proxy_pass http://readers;
        }

        # =====================================================================
        # FALLBACK (sollte nicht erreicht werden)
        # =====================================================================

        location / {
            proxy_pass http://readers;
        }
    }
}
